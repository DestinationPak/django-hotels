[metadata]
name = django-hotels
version = attr: django_hotels.__version__
description = A Django Rest API for managing hotels, room types, availability, and bookings.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/DestinationPak/django-hotels
author = Awais Jibran
author_email = awaisdar001@gmail.com
license = MIT
classifiers =
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 4.2
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Internet :: WWW/HTTP
    Topic :: Internet :: WWW/HTTP :: Dynamic Content

[options]
include_package_data = True
packages = find:
python_requires = >=3.11
install_requires =
    Django>=4.2
    # Add other dependencies here

[options.package_data]
* =
    *.json
    *.txt
    *.md
    static/*

[options.extras_require]
dev =
    pytest>=7.0
    pytest-django>=4.5.0
    pylint>=2.0

[coverage:run]
source = django_hotels
omit =
    */migrations/*
    */tests/*
    */tests.py

[coverage:report]
show_missing = True
