[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "django-hotels"
dynamic = ["version"]
description = "A Django Rest API for managing hotels, room types, availability, and bookings."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Awais Jibran", email = "awaisdar001@gmail.com" }]
requires-python = ">=3.11"
keywords = ["django", "hotels", "rest", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2,<6.0",
    "djangorestframework>=3.16,<3.17",
    "django-filter>=23.2,<25.2",
    "drf-spectacular>=0.28.0",
    "swapper>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/DestinationPak/django-hotels"
Changelog = "https://github.com/DestinationPak/django-hotels/blob/master/CHANGELOG.md"
Issues = "https://github.com/DestinationPak/django-hotels/issues"
Source = "https://github.com/DestinationPak/django-hotels"

[project.optional-dependencies]
dev = [
    "factory-boy>=3.3",
    "Faker",
    "pytest>=7.0",
    "pytest-django>=4.5.0",
    "pytest-cov>=4.0",
    "pylint>=2.0",
    "pylint-django>=2.5.0",
    "pylint-plugin-utils",
    "isort",
    "pre-commit",
    "build",
    "twine",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "furo",
]

[tool.setuptools]
# PEP 621 metadata defaults this to true, which (combined with
# setuptools-scm's git-file-finder) sweeps every git-tracked file under a
# found package's directory tree into the wheel as "package data" -
# including django_hotels/api/tests/*, bypassing packages.find's exclude
# below entirely. This package ships no non-Python data files, so opting
# out is correct, not just a workaround.
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["django_hotels*"]
# django_hotels.tests ships deliberately - django_hotels/tests/factories.py
# is a documented, consumer-facing fixture builder (see CLAUDE.md/README).
# django_hotels.api.tests is this package's own internal API test suite and
# isn't part of the public surface, so it's excluded from the built wheel.
exclude = ["django_hotels.api.tests", "django_hotels.api.tests.*"]

[tool.setuptools_scm]
# Version comes from the git tag alone (e.g. tag "0.4.0" -> "0.4.0").
# See devsite settings/README for the SETUPTOOLS_SCM_PRETEND_VERSION
# escape hatch used by local Docker dev, where no tag history exists.
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.coverage.run]
source = ["django_hotels"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
]

[tool.coverage.report]
show_missing = true
